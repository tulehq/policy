version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  tests: true

linters:
  enable:
    # Bugs & correctness
    - errcheck
    - govet
    - staticcheck
    - bodyclose
    - nilerr
    - contextcheck

    # Style & consistency
    - revive
    - misspell
    - whitespace
    - unconvert
    - predeclared

    # Complexity & maintainability
    - gocyclo
    - gocognit
    - cyclop
    - funlen
    - nestif

    # Performance
    - prealloc
    - gocritic

    # Security
    - gosec

    # Error handling
    - errorlint
    - wrapcheck

    # Architecture
    - depguard

    # Unused code
    - unused
    - unparam
    - wastedassign

  settings:
    govet:
      enable-all: true

    errorlint:
      errorf: true
      asserts: true
      comparison: true

    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(

    misspell:
      locale: US

    depguard:
      rules:
        # The library and its tests are stdlib only, so a service that
        # imports it takes on no dependencies.
        stdlib:
          list-mode: strict
          allow:
            - $gostd
            - tule.dev/policy

  exclusions:
    paths:
      - vendor
      - third_party
      - testdata

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines

  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(tule.dev/policy)

output:
  sort-order:
    - linter
    - severity
    - file
